<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuestros recuerdos ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .login {
            width: min(90%, 380px);
            padding: 35px;
            border-radius: 20px;
            background: #1c1c1c;
            text-align: center;
        }

        h1 {
            margin-bottom: 8px;
        }

        p {
            color: #aaa;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 0;
            border-radius: 10px;
            background: #292929;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            outline: 1px solid #666;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: white;
            color: #111;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #mensaje {
            margin-top: 15px;
            min-height: 20px;
            color: #ff8b8b;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>Nuestros recuerdos ❤️</h1>

        <p>
            Un pequeño lugar para guardar momentos especiales.
        </p>

        <input
            type="email"
            id="email"
            placeholder="Correo electrónico"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            autocomplete="current-password"
        >

        <button id="loginBtn" onclick="iniciarSesion()">
            Entrar
        </button>

        <div id="mensaje"></div>

    </div>


    <!-- Biblioteca de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Nuestra configuración -->
    <script src="js/supabase.js"></script>


    <script>

        async function iniciarSesion() {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const mensaje =
                document.getElementById("mensaje");

            const boton =
                document.getElementById("loginBtn");


            // Limpiar mensaje anterior
            mensaje.textContent = "";
            mensaje.style.color = "#ff8b8b";


            // Comprobar campos
            if (!email || !password) {

                mensaje.textContent =
                    "Completá el correo y la contraseña.";

                return;
            }


            // Desactivar botón mientras inicia sesión
            boton.disabled = true;
            boton.textContent = "Ingresando...";


            try {

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });


                if (error) {

                    console.error("Error de Supabase:", error);

                    mensaje.textContent =
                        "Correo o contraseña incorrectos.";

                    boton.disabled = false;
                    boton.textContent = "Entrar";

                    return;
                }


                // Login correcto
                mensaje.style.color = "#8cffad";
                mensaje.textContent = "¡Bienvenido! ❤️";


                console.log("Usuario autenticado:", data.user);


                // Esperamos un momento para mostrar el mensaje
                setTimeout(() => {

                    window.location.href = "recuerdos.html";

                }, 500);


            } catch (error) {

                console.error("Error inesperado:", error);

                mensaje.textContent =
                    "Ocurrió un error. Intentá nuevamente.";

                boton.disabled = false;
                boton.textContent = "Entrar";
            }

        }


        // Permitir presionar ENTER en los campos
        document
            .getElementById("password")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    iniciarSesion();

                }

            });

    </script>

</body>

</html>
