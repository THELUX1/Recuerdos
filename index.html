<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuestros recuerdos ❤️</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        font-family: Arial, Helvetica, sans-serif;

        background: #0e0e10;
        color: #f4f4f5;
    }

    .login {
        width: 100%;
        max-width: 390px;

        padding: 30px;

        background: #17171a;

        border: 1px solid rgba(255,255,255,.08);
        border-radius: 22px;

        text-align: center;

        box-shadow:
            0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
        font-size: 27px;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #929298;
        font-size: 14px;
        line-height: 1.5;

        margin-bottom: 25px;
    }

    input {
        width: 100%;

        padding: 14px;

        margin-bottom: 12px;

        border: 1px solid rgba(255,255,255,.08);
        border-radius: 12px;

        background: #101012;
        color: #f4f4f5;

        outline: none;
    }

    input:focus {
        border-color: rgba(255,255,255,.25);
    }

    button {
        width: 100%;

        padding: 14px;

        margin-top: 5px;

        border: none;
        border-radius: 12px;

        background: white;
        color: #111;

        font-weight: 600;

        cursor: pointer;
    }

    button:disabled {
        opacity: .5;
        cursor: wait;
    }

    #mensaje {
        min-height: 20px;

        margin-top: 15px;

        font-size: 14px;
    }

</style>
</head>

<body>

<div class="login">

    <h1>Nuestros recuerdos ❤️</h1>

    <p class="subtitle">
        Un pequeño lugar para guardar momentos especiales.
    </p>


    <input
        type="email"
        id="email"
        placeholder="Correo electrónico"
        autocomplete="email"
    >


    <input
        type="password"
        id="password"
        placeholder="Contraseña"
        autocomplete="current-password"
    >


    <button
        id="loginBtn"
        onclick="iniciarSesion()">

        Entrar

    </button>


    <div id="mensaje"></div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>


<script>

async function iniciarSesion() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const mensaje =
        document.getElementById("mensaje");

    const boton =
        document.getElementById("loginBtn");


    mensaje.textContent = "";
    mensaje.style.color = "#ff8b8b";


    if (!email || !password) {

        mensaje.textContent =
            "Completá el correo y la contraseña.";

        return;
    }


    boton.disabled = true;
    boton.textContent = "Ingresando...";


    try {

        console.log("Intentando iniciar sesión...");


        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


        if (error) {

            console.error(
                "Error de Supabase:",
                error
            );

            mensaje.textContent =
                "Correo o contraseña incorrectos.";

            boton.disabled = false;
            boton.textContent = "Entrar";

            return;
        }


        if (!data || !data.session) {

            console.error(
                "Supabase no devolvió una sesión."
            );

            mensaje.textContent =
                "No se pudo iniciar la sesión.";

            boton.disabled = false;
            boton.textContent = "Entrar";

            return;
        }


        console.log(
            "Inicio de sesión correcto:",
            data.user
        );


        mensaje.style.color = "#8cffad";

        mensaje.textContent =
            "¡Bienvenido! ❤️";


        /*
         * Reemplazamos la página actual.
         * No usamos un temporizador para evitar
         * que otra lógica interfiera.
         */

        window.location.replace(
            "./recuerdos.html"
        );

    }

    catch (error) {

        console.error(
            "Error inesperado:",
            error
        );

        mensaje.textContent =
            "Ocurrió un error. Intentá nuevamente.";

        boton.disabled = false;
        boton.textContent = "Entrar";

    }

}


/*
 * Permitir Enter para iniciar sesión.
 */

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                iniciarSesion();

            }

        }
    );

</script>

</body>
</html>
