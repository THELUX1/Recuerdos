<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuestros recuerdos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .login {
            width: min(90%, 380px);
            padding: 35px;
            border-radius: 20px;
            background: #1c1c1c;
            text-align: center;
        }

        h1 {
            margin-bottom: 8px;
        }

        p {
            color: #aaa;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 0;
            border-radius: 10px;
            background: #292929;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: white;
            color: #111;
            font-size: 16px;
            cursor: pointer;
        }

        #mensaje {
            margin-top: 15px;
            color: #ff8b8b;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>Nuestros recuerdos ❤️</h1>

        <p>Un pequeño lugar para guardar momentos especiales.</p>

        <input
            type="email"
            id="email"
            placeholder="Correo electrónico"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button onclick="iniciarSesion()">
            Entrar
        </button>

        <div id="mensaje"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <script>

        async function iniciarSesion() {

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const mensaje = document.getElementById("mensaje");

            mensaje.textContent = "";

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                mensaje.textContent = "Correo o contraseña incorrectos.";
                console.error(error);
                return;
            }

            mensaje.style.color = "#8cffad";
mensaje.textContent = "¡Bienvenido!";

setTimeout(() => {
    window.location.href = "recuerdos.html";
}, 500);

    </script>

</body>
</html>
