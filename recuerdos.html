<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Recuerdos</title>


    <style>

        * {
            box-sizing: border-box;
        }


        :root {
            --background: #0e0e10;
            --surface: #17171a;
            --surface-light: #202024;
            --text: #f4f4f5;
            --muted: #929298;
            --border: rgba(255,255,255,0.08);
        }


        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: var(--background);
            color: var(--text);

            overflow-x: hidden;
        }


        /* =========================
           BARRA SUPERIOR
        ========================== */

        .topbar {

            height: 70px;

            display: flex;
            align-items: center;

            padding: 0 22px;

            border-bottom: 1px solid var(--border);

            background: rgba(14,14,16,0.92);

            backdrop-filter: blur(15px);

            position: sticky;
            top: 0;

            z-index: 50;
        }


        .menu-button {

            width: 42px;
            height: 42px;

            border: none;
            border-radius: 12px;

            background: transparent;

            color: white;

            font-size: 23px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: background 0.2s;
        }


        .menu-button:hover {
            background: var(--surface-light);
        }


        .topbar-title {

            margin-left: 12px;

            font-size: 20px;

            font-weight: 600;

            letter-spacing: -0.3px;
        }


        /* =========================
           CONTENIDO
        ========================== */

        main {

            width: min(1150px, 92%);

            margin: auto;

            padding: 35px 0 70px;
        }


        .intro {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 28px;
        }


        .intro h1 {

            margin: 0;

            font-size: 30px;

            font-weight: 600;

            letter-spacing: -1px;
        }


        .intro p {

            margin: 7px 0 0;

            color: var(--muted);

            font-size: 14px;
        }


        .add-button {

            border: none;

            padding: 13px 18px;

            border-radius: 12px;

            background: white;

            color: #111;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            white-space: nowrap;

            transition:
                transform 0.2s,
                opacity 0.2s;
        }


        .add-button:hover {

            transform: translateY(-1px);

            opacity: 0.9;
        }


        /* =========================
           ESTADO VACÍO
        ========================== */

        #estado {

            min-height: 300px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: var(--muted);
        }


        .empty-icon {

            width: 65px;
            height: 65px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: var(--surface);

            font-size: 27px;

            margin-bottom: 18px;
        }


        .empty-title {

            color: var(--text);

            font-size: 17px;

            margin-bottom: 6px;
        }


        .empty-text {

            font-size: 14px;

            max-width: 280px;

            line-height: 1.5;
        }


        /* =========================
           ÁLBUM
        ========================== */

        #album {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(220px, 1fr)
                );

            gap: 18px;
        }


        .recuerdo {

            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 17px;

            overflow: hidden;

            transition:
                transform 0.25s,
                border-color 0.25s;
        }


        .recuerdo:hover {

            transform: translateY(-3px);

            border-color:
                rgba(255,255,255,0.16);
        }


        .recuerdo img {

            width: 100%;

            aspect-ratio: 1;

            object-fit: cover;

            display: block;
        }


        .info {

            padding: 14px;
        }


        .info h3 {

            margin: 0 0 5px;

            font-size: 15px;
        }


        .info p {

            margin: 0;

            color: var(--muted);

            font-size: 13px;

            line-height: 1.45;
        }


        /* =========================
           MENÚ LATERAL
        ========================== */

        .overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.55);

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.25s;

            z-index: 90;
        }


        .overlay.activo {

            opacity: 1;

            visibility: visible;
        }


        .sidebar {

            position: fixed;

            top: 0;
            left: 0;

            width: min(310px, 82vw);

            height: 100vh;

            background: #151518;

            border-right:
                1px solid var(--border);

            transform:
                translateX(-100%);

            transition:
                transform 0.3s ease;

            z-index: 100;

            display: flex;

            flex-direction: column;

            padding: 25px 16px;
        }


        .sidebar.activo {

            transform:
                translateX(0);
        }


        .sidebar-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 5px 25px;

            border-bottom:
                1px solid var(--border);
        }


        .sidebar-title {

            font-size: 20px;

            font-weight: 600;
        }


        .close-button {

            width: 38px;
            height: 38px;

            border: none;

            border-radius: 10px;

            background: transparent;

            color: white;

            font-size: 21px;

            cursor: pointer;
        }


        .close-button:hover {

            background:
                var(--surface-light);
        }


        .menu-items {

            padding-top: 20px;
        }


        .menu-item {

            width: 100%;

            display: flex;

            align-items: center;

            gap: 13px;

            padding: 13px;

            margin-bottom: 5px;

            border: none;

            border-radius: 11px;

            background: transparent;

            color: #d7d7db;

            font-size: 14px;

            text-align: left;

            cursor: pointer;
        }


        .menu-item:hover {

            background:
                var(--surface-light);

            color: white;
        }


        .menu-icon {

            width: 24px;

            text-align: center;

            font-size: 17px;
        }


        .sidebar-bottom {

            margin-top: auto;

            padding-top: 20px;

            border-top:
                1px solid var(--border);
        }


        .account {

            padding: 10px 12px 15px;
        }


        .account-label {

            font-size: 11px;

            color: #77777e;

            margin-bottom: 5px;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }


        .account-email {

            font-size: 13px;

            color: #c4c4c9;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .logout {

            color: #e3a0a0;
        }


        /* =========================
           MODAL
        ========================== */

        .modal {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.78);

            display: none;

            justify-content: center;

            align-items: center;

            padding: 20px;

            z-index: 200;
        }


        .modal.activo {

            display: flex;
        }


        .modal-contenido {

            width: min(100%, 440px);

            max-height: 90vh;

            overflow-y: auto;

            background: #19191c;

            border:
                1px solid var(--border);

            border-radius: 20px;

            padding: 25px;
        }


        .modal-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 25px;
        }


        .modal-header h2 {

            margin: 0;

            font-size: 20px;
        }


        .modal-close {

            width: 36px;
            height: 36px;

            border: none;

            border-radius: 9px;

            background: transparent;

            color: white;

            font-size: 20px;

            cursor: pointer;
        }


        .modal-close:hover {

            background:
                var(--surface-light);
        }


        .campo {

            margin-bottom: 17px;
        }


        .campo label {

            display: block;

            margin-bottom: 7px;

            color: #c9c9ce;

            font-size: 13px;
        }


        .campo input,
        .campo textarea {

            width: 100%;

            padding: 13px;

            border: 1px solid
                rgba(255,255,255,0.07);

            border-radius: 10px;

            background: #242428;

            color: white;

            font-size: 14px;

            font-family: inherit;

            outline: none;
        }


        .campo input:focus,
        .campo textarea:focus {

            border-color:
                rgba(255,255,255,0.25);
        }


        .campo textarea {

            resize: vertical;

            min-height: 95px;
        }


        #foto {

            padding: 10px;

            cursor: pointer;
        }


        .botones-modal {

            display: flex;

            gap: 10px;

            margin-top: 24px;
        }


        .botones-modal button {

            flex: 1;

            padding: 13px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-size: 14px;
        }


        .btn-cancelar {

            background:
                var(--surface-light);

            color: white;
        }


        .btn-guardar {

            background: white;

            color: #111;

            font-weight: 600;
        }


        /* =========================
           MÓVIL
        ========================== */

        @media (max-width: 600px) {

            .topbar {
                height: 62px;
                padding: 0 15px;
            }


            .topbar-title {
                font-size: 18px;
            }


            main {
                width: 90%;
                padding-top: 25px;
            }


            .intro {

                align-items: flex-start;

                flex-direction: column;

                margin-bottom: 25px;
            }


            .intro h1 {
                font-size: 27px;
            }


            .add-button {
                width: 100%;
            }


            #album {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 9px;
            }


            .recuerdo {
                border-radius: 12px;
            }


            .info {
                padding: 10px;
            }


            .info h3 {
                font-size: 13px;
            }


            .info p {
                font-size: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         BARRA SUPERIOR
    ========================== -->

    <header class="topbar">

        <button
            class="menu-button"
            onclick="abrirMenu()"
            aria-label="Abrir menú">

            ☰

        </button>


        <div class="topbar-title">
            Recuerdos
        </div>

    </header>



    <!-- =========================
         CONTENIDO
    ========================== -->

    <main>

        <div class="intro">

            <div>

                <h1>
                    Momentos
                </h1>

                <p>
                    Una colección de recuerdos.
                </p>

            </div>


            <button
                class="add-button"
                onclick="abrirModal()">

                ＋ Agregar recuerdo

            </button>

        </div>


        <div id="estado">

            <div class="empty-icon">
                📷
            </div>

            <div class="empty-title">
                Todavía no hay recuerdos
            </div>

            <div class="empty-text">
                Cuando guardes tu primer momento,
                va a aparecer acá.
            </div>

        </div>


        <div id="album"></div>

    </main>



    <!-- =========================
         OVERLAY
    ========================== -->

    <div
        id="overlay"
        class="overlay"
        onclick="cerrarMenu()">
    </div>



    <!-- =========================
         MENÚ LATERAL
    ========================== -->

    <aside
        id="sidebar"
        class="sidebar">


        <div class="sidebar-header">

            <div class="sidebar-title">
                Recuerdos
            </div>


            <button
                class="close-button"
                onclick="cerrarMenu()">

                ×

            </button>

        </div>


        <div class="menu-items">

            <button
                class="menu-item"
                onclick="cerrarMenu()">

                <span class="menu-icon">
                    🏠
                </span>

                <span>
                    Momentos
                </span>

            </button>


            <button
                class="menu-item"
                onclick="cerrarMenu()">

                <span class="menu-icon">
                    ⭐
                </span>

                <span>
                    Favoritos
                </span>

            </button>


            <button
                class="menu-item"
                onclick="cerrarMenu()">

                <span class="menu-icon">
                    🗓️
                </span>

                <span>
                    Línea de tiempo
                </span>

            </button>

        </div>


        <div class="sidebar-bottom">

            <div class="account">

                <div class="account-label">
                    Cuenta
                </div>

                <div
                    id="usuario"
                    class="account-email">
                    Cargando...
                </div>

            </div>


            <button
                class="menu-item logout"
                onclick="cerrarSesion()">

                <span class="menu-icon">
                    ↪
                </span>

                <span>
                    Cerrar sesión
                </span>

            </button>

        </div>

    </aside>



    <!-- =========================
         MODAL AGREGAR RECUERDO
    ========================== -->

    <div
        id="modal"
        class="modal">


        <div class="modal-contenido">


            <div class="modal-header">

                <h2>
                    Nuevo recuerdo
                </h2>


                <button
                    class="modal-close"
                    onclick="cerrarModal()">

                    ×

                </button>

            </div>


            <div class="campo">

                <label for="foto">
                    Foto
                </label>

                <input
                    type="file"
                    id="foto"
                    accept="image/*">

            </div>


            <div class="campo">

                <label for="titulo">
                    Título
                </label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Por ejemplo: Nuestro primer paseo">

            </div>


            <div class="campo">

                <label for="descripcion">
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    placeholder="Escribí algo sobre este recuerdo..."></textarea>

            </div>


            <div class="campo">

                <label for="fecha">
                    Fecha
                </label>

                <input
                    type="date"
                    id="fecha">

            </div>


            <div class="botones-modal">

                <button
                    class="btn-cancelar"
                    onclick="cerrarModal()">

                    Cancelar

                </button>


                <button
                    class="btn-guardar"
                    onclick="guardarRecuerdo()">

                    Guardar recuerdo

                </button>

            </div>

        </div>

    </div>



    <!-- =========================
         SUPABASE
    ========================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>


    <script>


        /* =========================
           SESIÓN
        ========================== */

        async function comprobarSesion() {

            const { data, error } =
                await supabaseClient.auth.getSession();


            if (!data.session) {

                window.location.href =
                    "index.html";

                return;

            }


            document.getElementById("usuario")
                .textContent =
                data.session.user.email;


            cargarRecuerdos();

        }



        /* =========================
           CARGAR RECUERDOS
        ========================== */

        async function cargarRecuerdos() {

            const estado =
                document.getElementById("estado");


            const { data, error } =
                await supabaseClient
                    .from("memories")
                    .select("*")
                    .order("date", {
                        ascending: false
                    });


            if (error) {

                console.error(error);

                estado.innerHTML = `

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <div class="empty-title">
                        No pudimos cargar los recuerdos
                    </div>

                `;

                return;

            }


            if (!data || data.length === 0) {

                estado.style.display =
                    "flex";

                return;

            }


            estado.style.display =
                "none";


            /*
             * Todavía no mostramos las fotos.
             * Primero necesitamos generar
             * URLs firmadas para el bucket privado.
             */

        }



        /* =========================
           MENÚ
        ========================== */

        function abrirMenu() {

            document
                .getElementById("sidebar")
                .classList.add("activo");


            document
                .getElementById("overlay")
                .classList.add("activo");

        }


        function cerrarMenu() {

            document
                .getElementById("sidebar")
                .classList.remove("activo");


            document
                .getElementById("overlay")
                .classList.remove("activo");

        }



        /* =========================
           MODAL
        ========================== */

        function abrirModal() {

            document
                .getElementById("modal")
                .classList.add("activo");

        }


        function cerrarModal() {

            document
                .getElementById("modal")
                .classList.remove("activo");

        }



        /* =========================
           GUARDAR
        ========================== */

        async function guardarRecuerdo() {

            alert(
                "La subida de fotos la conectaremos en el próximo paso 📸"
            );

        }



        /* =========================
           CERRAR SESIÓN
        ========================== */

        async function cerrarSesion() {

            await supabaseClient.auth.signOut();

            window.location.href =
                "index.html";

        }



        /* =========================
           INICIAR
        ========================== */

        comprobarSesion();


    </script>

</body>

</html>
