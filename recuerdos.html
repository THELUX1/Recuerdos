<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuerdos ❤️</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0d0d0f;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .app {
            min-height: 100vh;
            display: flex;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: #151518;
            border-right: 1px solid #29292e;
            padding: 25px 18px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 35px;
            padding-left: 10px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .menu-item {
            width: 100%;
            border: 0;
            background: transparent;
            color: #aaa;
            padding: 13px 12px;
            border-radius: 10px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-item:hover {
            background: #222226;
            color: white;
        }

        .menu-item.active {
            background: #29292e;
            color: white;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .user-email {
            color: #777;
            font-size: 12px;
            padding: 10px 12px;
            word-break: break-word;
        }

        .logout {
            color: #e98b8b;
        }

        /* CONTENIDO */

        .content {
            margin-left: 250px;
            width: calc(100% - 250px);
            min-height: 100vh;
            padding: 35px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .title h1 {
            margin: 0;
            font-size: 30px;
        }

        .title p {
            margin: 7px 0 0;
            color: #888;
        }

        .add-button {
            background: white;
            color: black;
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-button:hover {
            background: #ddd;
        }

        /* GALERÍA */

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background: #17171a;
            border: 1px solid #27272c;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform .2s, border-color .2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #414149;
        }

        .card-image {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
            background: #111;
        }

        .card-info {
            padding: 14px;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .card-description {
            color: #999;
            font-size: 13px;
            line-height: 1.4;
        }

        .card-date {
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 70px 20px;
            grid-column: 1 / -1;
        }

        .loading {
            text-align: center;
            color: #888;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }

        /* MODAL */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.78);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: min(600px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: #17171a;
            border: 1px solid #303036;
            border-radius: 18px;
            padding: 24px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            background: #27272c;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #aaa;
            font-size: 13px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            border: 1px solid #303036;
            background: #101012;
            color: white;
            border-radius: 10px;
            padding: 12px;
            outline: none;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #55555f;
        }

        .file-box {
            border: 1px dashed #45454d;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            background: #111114;
        }

        .file-box input {
            border: none;
            padding: 0;
            background: transparent;
        }

        .save-button {
            width: 100%;
            background: white;
            color: black;
            border: none;
            border-radius: 11px;
            padding: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .save-button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        /* VISOR */

        .viewer {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .viewer.show {
            display: flex;
        }

        .viewer img {
            max-width: 95vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 5px;
        }

        .viewer-close {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,.15);
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        /* TOAST */

        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #242428;
            color: white;
            border: 1px solid #3b3b42;
            padding: 13px 17px;
            border-radius: 10px;
            z-index: 500;
            display: none;
            max-width: 330px;
            font-size: 14px;
        }

        .toast.show {
            display: block;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 70px;
                padding: 20px 10px;
            }

            .logo {
                font-size: 0;
                text-align: center;
                padding: 0;
            }

            .logo::after {
                content: "❤️";
                font-size: 22px;
            }

            .menu-item {
                justify-content: center;
                padding: 13px 5px;
            }

            .menu-item span {
                display: none;
            }

            .user-email {
                display: none;
            }

            .content {
                margin-left: 70px;
                width: calc(100% - 70px);
                padding: 20px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .add-button {
                width: 100%;
            }

            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .card-image {
                height: 170px;
            }

            .card-info {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            Nuestros recuerdos
        </div>

        <div class="menu">

            <button class="menu-item active">
                🏠
                <span>Momentos</span>
            </button>

            <button class="menu-item">
                ❤️
                <span>Favoritos</span>
            </button>

            <button class="menu-item">
                📅
                <span>Línea de tiempo</span>
            </button>

        </div>

        <div class="sidebar-bottom">

            <div class="user-email" id="emailUsuario">
                Cargando...
            </div>

            <button
                id="logoutButton"
                class="menu-item logout"
                onclick="cerrarSesion()"
            >
                ↪
                <span>Cerrar sesión</span>
            </button>

        </div>

    </aside>


    <!-- CONTENIDO -->

    <main class="content">

        <div class="topbar">

            <div class="title">
                <h1>Nuestros momentos ❤️</h1>
                <p>Un lugar para guardar recuerdos juntos.</p>
            </div>

            <button
                class="add-button"
                onclick="abrirModal()"
            >
                + Agregar recuerdo
            </button>

        </div>


        <div
            id="gallery"
            class="gallery"
        >
            <div class="loading">
                Cargando recuerdos...
            </div>
        </div>

    </main>

</div>


<!-- MODAL AGREGAR -->

<div
    id="modal"
    class="modal"
    onclick="cerrarModalFondo(event)"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>Nuevo recuerdo 📷</h2>

            <button
                class="close"
                onclick="cerrarModal()"
            >
                ×
            </button>

        </div>


        <form onsubmit="guardarRecuerdo(event)">

            <div class="form-group">

                <label>Foto</label>

                <div class="file-box">

                    <input
                        id="archivo"
                        type="file"
                        accept="image/*"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="titulo">
                    Título
                </label>

                <input
                    id="titulo"
                    type="text"
                    placeholder="Ej: Nuestra primera salida"
                    maxlength="100"
                >

            </div>


            <div class="form-group">

                <label for="descripcion">
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    placeholder="Contá algo sobre este momento..."
                    maxlength="500"
                ></textarea>

            </div>


            <div class="form-group">

                <label for="fecha">
                    Fecha
                </label>

                <input
                    id="fecha"
                    type="date"
                >

            </div>


            <button
                id="saveButton"
                class="save-button"
                type="submit"
            >
                Guardar recuerdo ❤️
            </button>

        </form>

    </div>

</div>


<!-- VISOR DE IMAGEN -->

<div
    id="viewer"
    class="viewer"
    onclick="cerrarViewerFondo(event)"
>

    <button
        class="viewer-close"
        onclick="cerrarViewer()"
    >
        ×
    </button>

    <img
        id="viewerImage"
        src=""
        alt="Recuerdo"
    >

</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast"
></div>


<script>

    let usuarioActual = null;


    /* =========================
       SESIÓN
    ========================= */

    async function comprobarSesion() {

        try {

            const { data, error } =
                await supabaseClient.auth.getSession();

            if (error) {

                console.error(
                    "Error obteniendo sesión:",
                    error
                );

                window.location.replace("./index.html");
                return;
            }


            if (!data || !data.session) {

                window.location.replace("./index.html");
                return;
            }


            usuarioActual = data.session.user;


            document.getElementById(
                "emailUsuario"
            ).textContent =
                usuarioActual.email || "";


            await cargarRecuerdos();

        } catch (error) {

            console.error(
                "Error comprobando sesión:",
                error
            );

            window.location.replace("./index.html");

        }

    }


    /* =========================
       CERRAR SESIÓN
    ========================= */

    async function cerrarSesion() {

        const boton =
            document.getElementById("logoutButton");


        if (boton) {

            boton.disabled = true;

            boton.innerHTML =
                "↪ <span>Cerrando sesión...</span>";

        }


        try {

            const { error } =
                await supabaseClient.auth.signOut();


            if (error) {

                console.error(
                    "Error cerrando sesión:",
                    error
                );

            }


            window.location.replace("./index.html");

        } catch (error) {

            console.error(
                "Error inesperado:",
                error
            );

            window.location.replace("./index.html");

        }

    }


    /* =========================
       CARGAR RECUERDOS
    ========================= */

    async function cargarRecuerdos() {

        const gallery =
            document.getElementById("gallery");


        gallery.innerHTML =
            '<div class="loading">Cargando recuerdos...</div>';


        try {

            const {
                data: recuerdos,
                error
            } =
                await supabaseClient
                    .from("memories")
                    .select("*")
                    .order("date", {
                        ascending: false
                    });


            if (error) {

                console.error(
                    "Error cargando recuerdos:",
                    error
                );

                throw error;

            }


            if (!recuerdos || recuerdos.length === 0) {

                gallery.innerHTML = `
                    <div class="empty">
                        <div style="font-size:45px;margin-bottom:15px;">
                            📷
                        </div>

                        <div style="font-size:18px;color:#aaa;">
                            Todavía no hay recuerdos.
                        </div>

                        <div style="font-size:13px;margin-top:7px;">
                            Agregá el primero ❤️
                        </div>
                    </div>
                `;

                return;
            }


            gallery.innerHTML = "";


            for (const recuerdo of recuerdos) {

                const {
                    data: signedData,
                    error: signedError
                } =
                    await supabaseClient
                        .storage
                        .from("Recuerdos")
                        .createSignedUrl(
                            recuerdo.storage_path,
                            3600
                        );


                if (signedError) {

                    console.error(
                        "Error creando URL:",
                        signedError
                    );

                    continue;

                }


                const card =
                    document.createElement("div");

                card.className = "card";


                const fecha =
                    recuerdo.date
                        ? formatearFecha(recuerdo.date)
                        : "";


                card.innerHTML = `

                    <img
                        class="card-image"
                        src="${signedData.signedUrl}"
                        alt="${escaparHTML(recuerdo.title || "Recuerdo")}"
                    >

                    <div class="card-info">

                        <div class="card-title">
                            ${escaparHTML(
                                recuerdo.title || "Sin título"
                            )}
                        </div>

                        ${
                            recuerdo.description
                            ? `
                                <div class="card-description">
                                    ${escaparHTML(
                                        recuerdo.description
                                    )}
                                </div>
                            `
                            : ""
                        }

                        ${
                            fecha
                            ? `
                                <div class="card-date">
                                    ${fecha}
                                </div>
                            `
                            : ""
                        }

                    </div>

                `;


                const imagen =
                    card.querySelector(".card-image");


                imagen.addEventListener(
                    "click",
                    function(event) {

                        event.stopPropagation();

                        abrirViewer(
                            signedData.signedUrl
                        );

                    }
                );


                gallery.appendChild(card);

            }


        } catch (error) {

            console.error(
                "Error cargando recuerdos:",
                error
            );


            gallery.innerHTML = `

                <div class="empty">

                    <div style="font-size:40px;">
                        ⚠️
                    </div>

                    <div style="margin-top:10px;color:#aaa;">
                        No se pudieron cargar los recuerdos.
                    </div>

                </div>

            `;

        }

    }


    /* =========================
       GUARDAR RECUERDO
    ========================= */

    async function guardarRecuerdo(event) {

        event.preventDefault();


        if (!usuarioActual) {

            mostrarToast(
                "No hay una sesión activa."
            );

            return;

        }


        const archivo =
            document.getElementById("archivo").files[0];

        const titulo =
            document.getElementById("titulo").value.trim();

        const descripcion =
            document.getElementById("descripcion").value.trim();

        const fecha =
            document.getElementById("fecha").value;


        if (!archivo) {

            mostrarToast(
                "Seleccioná una imagen."
            );

            return;

        }


        /* VALIDACIÓN */

        if (!archivo.type.startsWith("image/")) {

            mostrarToast(
                "El archivo debe ser una imagen."
            );

            return;

        }


        const maxSize =
            20 * 1024 * 1024;


        if (archivo.size > maxSize) {

            mostrarToast(
                "La imagen no puede superar los 20 MB."
            );

            return;

        }


        const boton =
            document.getElementById("saveButton");


        boton.disabled = true;

        boton.textContent =
            "Subiendo imagen...";


        try {

            /*
             * Creamos un nombre único.
             */

            const extension =
                archivo.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const nombreUnico =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2, 10) +
                "." +
                extension;


            /*
             * Cada usuario tiene su propia carpeta.
             */

            const rutaArchivo =
                "fotos/" +
                usuarioActual.id +
                "/" +
                nombreUnico;


            console.log(
                "Subiendo a:",
                rutaArchivo
            );


            /* =========================
               SUBIR A STORAGE
            ========================= */

            const {
                error: uploadError
            } =
                await supabaseClient
                    .storage
                    .from("Recuerdos")
                    .upload(
                        rutaArchivo,
                        archivo,
                        {
                            cacheControl: "3600",
                            upsert: false,
                            contentType: archivo.type
                        }
                    );


            if (uploadError) {

                console.error(
                    "Error subiendo imagen:",
                    uploadError
                );


                alert(
                    "ERROR DE SUPABASE\n\n" +
                    "Mensaje: " +
                    (
                        uploadError.message ||
                        "desconocido"
                    ) +
                    "\n\nCódigo: " +
                    (
                        uploadError.statusCode ||
                        "sin código"
                    )
                );


                throw uploadError;

            }


            console.log(
                "Imagen subida correctamente."
            );


            boton.textContent =
                "Guardando recuerdo...";


            /* =========================
               GUARDAR DATOS EN DATABASE
            ========================= */

            const {
                error: dbError
            } =
                await supabaseClient
                    .from("memories")
                    .insert({

                        title:
                            titulo ||
                            "Sin título",

                        description:
                            descripcion ||
                            "",

                        date:
                            fecha ||
                            new Date()
                                .toISOString()
                                .split("T")[0],

                        media_type:
                            "photo",

                        storage_path:
                            rutaArchivo,

                        created_by:
                            usuarioActual.id

                    });


            if (dbError) {

                console.error(
                    "Error guardando metadata:",
                    dbError
                );


                /*
                 * Si la imagen se subió pero
                 * la base de datos falló,
                 * intentamos eliminar la imagen.
                 */

                await supabaseClient
                    .storage
                    .from("Recuerdos")
                    .remove([
                        rutaArchivo
                    ]);


                throw dbError;

            }


            /* =========================
               ÉXITO
            ========================= */

            cerrarModal();


            document.getElementById(
                "archivo"
            ).value = "";


            document.getElementById(
                "titulo"
            ).value = "";


            document.getElementById(
                "descripcion"
            ).value = "";


            document.getElementById(
                "fecha"
            ).value = "";


            mostrarToast(
                "Recuerdo guardado ❤️"
            );


            await cargarRecuerdos();


        } catch (error) {

            console.error(
                "Error completo:",
                error
            );


            if (
                error &&
                error.message &&
                !error.message.includes(
                    "Bucket not found"
                )
            ) {

                mostrarToast(
                    "No se pudo guardar el recuerdo."
                );

            }

        } finally {

            boton.disabled = false;

            boton.textContent =
                "Guardar recuerdo ❤️";

        }

    }


    /* =========================
       MODAL
    ========================= */

    function abrirModal() {

        document
            .getElementById("modal")
            .classList.add("show");

    }


    function cerrarModal() {

        document
            .getElementById("modal")
            .classList.remove("show");

    }


    function cerrarModalFondo(event) {

        if (
            event.target.id === "modal"
        ) {

            cerrarModal();

        }

    }


    /* =========================
       VISOR
    ========================= */

    function abrirViewer(url) {

        document.getElementById(
            "viewerImage"
        ).src = url;


        document
            .getElementById("viewer")
            .classList.add("show");

    }


    function cerrarViewer() {

        document
            .getElementById("viewer")
            .classList.remove("show");


        document.getElementById(
            "viewerImage"
        ).src = "";

    }


    function cerrarViewerFondo(event) {

        if (
            event.target.id === "viewer"
        ) {

            cerrarViewer();

        }

    }


    /* =========================
       TOAST
    ========================= */

    function mostrarToast(mensaje) {

        const toast =
            document.getElementById("toast");


        toast.textContent =
            mensaje;


        toast.classList.add("show");


        setTimeout(
            function() {

                toast.classList.remove("show");

            },
            3000
        );

    }


    /* =========================
       UTILIDADES
    ========================= */

    function formatearFecha(fecha) {

        try {

            const partes =
                fecha.split("-");


            if (partes.length !== 3) {
                return fecha;
            }


            return (
                partes[2] +
                "/" +
                partes[1] +
                "/" +
                partes[0]
            );

        } catch {

            return fecha;

        }

    }


    function escaparHTML(texto) {

        return String(texto)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================
       INICIO
    ========================= */

    document.addEventListener(
        "DOMContentLoaded",
        comprobarSesion
    );

</script>

</body>
</html>
