<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nuestra historia ❤️</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client"></script>

    <!-- Configuración de Supabase -->
    <script src="js/supabase.js"></script>

    <!-- Google Drive -->
    <script src="js/google-drive.js"></script>

    <!-- Estilos -->
    <link
        rel="stylesheet"
        href="css/recuerdos.css"
    >
</head>

<body>

    <!-- =========================
         MENÚ MÓVIL
    ========================== -->

    <button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="Abrir menú"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div
        id="menuOverlay"
        class="menu-overlay"
    ></div>


    <!-- =========================
         APP
    ========================== -->

    <div class="app">

        <!-- SIDEBAR -->

        <aside
            id="sidebar"
            class="sidebar"
        >

            <div class="logo">

                <div class="logo-icon">
                    ♡
                </div>

                <div class="logo-text">
                    <strong>Nuestra</strong>
                    <span>historia</span>
                </div>

            </div>


            <!-- NAVEGACIÓN -->

            <nav class="navigation">

                <button
                    class="nav-item active"
                    data-section="momentos"
                    type="button"
                >
                    <span class="nav-icon">⌂</span>
                    <span>Momentos</span>
                </button>

                <button
                    class="nav-item"
                    data-section="favoritos"
                    type="button"
                >
                    <span class="nav-icon">♡</span>
                    <span>Favoritos</span>
                </button>

                <button
                    class="nav-item"
                    data-section="timeline"
                    type="button"
                >
                    <span class="nav-icon">◷</span>
                    <span>Línea de tiempo</span>
                </button>

            </nav>


            <!-- PARTE INFERIOR -->

            <div class="sidebar-bottom">

                <button
                    id="googleDriveButton"
                    class="drive-button"
                    type="button"
                >
                    <span>☁</span>

                    <div>
                        <strong>Google Drive</strong>
                        <small id="googleDriveStatus">
                            Conectar almacenamiento
                        </small>
                    </div>
                </button>


                <div class="user-card">

                    <div class="user-avatar">
                        ♡
                    </div>

                    <div class="user-info">

                        <span>
                            Sesión iniciada
                        </span>

                        <strong id="emailUsuario">
                            Cargando...
                        </strong>

                    </div>

                </div>


                <button
                    id="logoutButton"
                    class="logout-button"
                    type="button"
                >
                    <span>↪</span>
                    <span>Cerrar sesión</span>
                </button>

            </div>

        </aside>


        <!-- =========================
             CONTENIDO
        ========================== -->

        <main class="main-content">

            <header class="page-header">

                <div>

                    <span class="eyebrow">
                        NUESTRA HISTORIA
                    </span>

                    <h1 id="sectionTitle">
                        Momentos
                    </h1>

                    <p id="sectionDescription">
                        Un pequeño lugar para guardar
                        todo lo que no queremos olvidar.
                    </p>

                </div>


                <button
                    id="addMemoryButton"
                    class="add-memory"
                    type="button"
                >
                    <span>+</span>
                    Nuevo recuerdo
                </button>

            </header>


            <!-- GALERÍA -->

            <section
                id="gallery"
                class="gallery"
            >

                <div class="loading">
                    Cargando recuerdos...
                </div>

            </section>

        </main>

    </div>


    <!-- =========================
         MODAL NUEVO RECUERDO
    ========================== -->

    <div
        id="modal"
        class="modal"
        aria-hidden="true"
    >

        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
        >

            <div class="modal-header">

                <div>

                    <span class="eyebrow">
                        NUEVO MOMENTO
                    </span>

                    <h2>
                        Guardar recuerdo
                    </h2>

                </div>

                <button
                    id="modalClose"
                    class="modal-close"
                    type="button"
                >
                    ×
                </button>

            </div>


            <form id="memoryForm">

                <!-- ARCHIVO -->

                <label
                    class="upload-area"
                    for="archivo"
                >

                    <span class="upload-icon">
                        ↑
                    </span>

                    <strong id="fileName">
                        Elegí una foto
                    </strong>

                    <span>
                        JPG, PNG, WEBP · Máximo 20 MB
                    </span>

                    <input
                        id="archivo"
                        type="file"
                        accept="image/*"
                        required
                    >

                </label>


                <!-- TÍTULO -->

                <div class="form-field">

                    <label for="titulo">
                        Título
                    </label>

                    <input
                        id="titulo"
                        type="text"
                        placeholder="¿Qué estaba pasando?"
                        maxlength="100"
                    >

                </div>


                <!-- DESCRIPCIÓN -->

                <div class="form-field">

                    <label for="descripcion">
                        Descripción
                    </label>

                    <textarea
                        id="descripcion"
                        placeholder="Guardá algún detalle de este momento..."
                        maxlength="500"
                    ></textarea>

                </div>


                <!-- FECHA -->

                <div class="form-field">

                    <label for="fecha">
                        Fecha
                    </label>

                    <input
                        id="fecha"
                        type="date"
                    >

                </div>


                <button
                    id="saveButton"
                    class="save-memory"
                    type="submit"
                >
                    <span id="saveButtonText">
                        Guardar recuerdo
                    </span>

                    <span>
                        ♡
                    </span>
                </button>

            </form>

        </div>

    </div>


    <!-- =========================
         VISOR
    ========================== -->

    <div
        id="viewer"
        class="viewer"
        aria-hidden="true"
    >

        <button
            id="viewerClose"
            class="viewer-close"
            type="button"
        >
            ×
        </button>


        <div class="viewer-content">

            <img
                id="viewerImage"
                src=""
                alt="Recuerdo"
            >

            <div
                id="viewerInfo"
                class="viewer-info"
            >
                <h2 id="viewerTitle"></h2>
                <p id="viewerDescription"></p>
                <span id="viewerDate"></span>
            </div>

        </div>

    </div>


    <!-- TOAST -->

    <div
        id="toast"
        class="toast"
    ></div>


    <!-- JAVASCRIPT -->

    <script src="js/recuerdos.js"></script>

</body>

</html>
