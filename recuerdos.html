<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuerdos</title>

<style>
    :root {
        --background: #0e0e10;
        --surface: #17171a;
        --surface-light: #202024;
        --text: #f4f4f5;
        --muted: #929298;
        --border: rgba(255,255,255,0.08);
        --accent: #ffffff;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: var(--background);
        color: var(--text);
        min-height: 100vh;
    }

    button,
    input,
    textarea {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    /* TOPBAR */

    .topbar {
        position: sticky;
        top: 0;
        z-index: 50;

        height: 64px;
        display: flex;
        align-items: center;

        padding: 0 20px;

        background: rgba(14,14,16,0.92);
        backdrop-filter: blur(14px);

        border-bottom: 1px solid var(--border);
    }

    .menu-button {
        width: 42px;
        height: 42px;

        border: none;
        border-radius: 12px;

        background: transparent;
        color: var(--text);

        font-size: 25px;
    }

    .menu-button:hover {
        background: var(--surface-light);
    }

    .topbar-title {
        margin-left: 12px;
        font-size: 18px;
        font-weight: 600;
    }

    /* CONTENT */

    main {
        width: 100%;
        max-width: 1100px;
        margin: auto;
        padding: 35px 20px 60px;
    }

    .heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;

        margin-bottom: 30px;
    }

    .heading h1 {
        font-size: 32px;
        margin-bottom: 7px;
    }

    .heading p {
        color: var(--muted);
        font-size: 15px;
    }

    .add-button {
        border: none;
        border-radius: 14px;

        padding: 13px 18px;

        background: var(--accent);
        color: #111;

        font-weight: 600;
        transition: transform .15s, opacity .15s;
    }

    .add-button:hover {
        transform: translateY(-1px);
        opacity: .9;
    }

    /* EMPTY STATE */

    .empty {
        min-height: 330px;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        text-align: center;

        border: 1px dashed rgba(255,255,255,.12);
        border-radius: 20px;

        background: rgba(255,255,255,.015);
    }

    .empty-icon {
        font-size: 45px;
        margin-bottom: 15px;
    }

    .empty h2 {
        font-size: 21px;
        margin-bottom: 8px;
    }

    .empty p {
        color: var(--muted);
        max-width: 350px;
        line-height: 1.5;
    }

    /* GRID */

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
    }

    .card {
        overflow: hidden;

        border: 1px solid var(--border);
        border-radius: 18px;

        background: var(--surface);

        transition: transform .2s, border-color .2s;
    }

    .card:hover {
        transform: translateY(-3px);
        border-color: rgba(255,255,255,.16);
    }

    .card-image {
        width: 100%;
        aspect-ratio: 1 / 1;

        object-fit: cover;

        display: block;
        background: var(--surface-light);
    }

    .card-content {
        padding: 15px;
    }

    .card-title {
        font-size: 17px;
        font-weight: 600;
        margin-bottom: 6px;
    }

    .card-description {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.4;
    }

    .card-date {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
    }

    /* SIDEBAR */

    .overlay {
        position: fixed;
        inset: 0;

        background: rgba(0,0,0,.55);

        z-index: 90;

        opacity: 0;
        pointer-events: none;

        transition: opacity .25s;
    }

    .overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    .sidebar {
        position: fixed;
        top: 0;
        left: 0;

        width: min(310px, 85vw);
        height: 100vh;

        z-index: 100;

        background: #151518;
        border-right: 1px solid var(--border);

        padding: 20px;

        transform: translateX(-100%);
        transition: transform .25s ease;

        display: flex;
        flex-direction: column;
    }

    .sidebar.active {
        transform: translateX(0);
    }

    .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;

        margin-bottom: 25px;
    }

    .sidebar-title {
        font-size: 20px;
        font-weight: 600;
    }

    .close-menu {
        width: 40px;
        height: 40px;

        border: none;
        border-radius: 10px;

        background: transparent;
        color: var(--text);

        font-size: 22px;
    }

    .close-menu:hover {
        background: var(--surface-light);
    }

    .menu-item {
        width: 100%;

        display: flex;
        align-items: center;
        gap: 13px;

        padding: 13px 14px;
        margin-bottom: 5px;

        border: none;
        border-radius: 12px;

        background: transparent;
        color: var(--text);

        text-align: left;
        font-size: 15px;
    }

    .menu-item:hover {
        background: var(--surface-light);
    }

    .menu-item.active {
        background: var(--surface-light);
    }

    .sidebar-bottom {
        margin-top: auto;
    }

    .user-email {
        padding: 12px 14px;

        color: var(--muted);
        font-size: 12px;

        word-break: break-word;

        border-top: 1px solid var(--border);
        margin-bottom: 8px;
    }

    .logout {
        color: #ff8b8b;
    }

    /* MODAL */

    .modal-container {
        position: fixed;
        inset: 0;

        z-index: 200;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        background: rgba(0,0,0,.7);

        opacity: 0;
        pointer-events: none;

        transition: opacity .2s;
    }

    .modal-container.active {
        opacity: 1;
        pointer-events: auto;
    }

    .modal {
        width: 100%;
        max-width: 500px;

        padding: 25px;

        background: var(--surface);

        border: 1px solid var(--border);
        border-radius: 20px;

        transform: translateY(10px);
        transition: transform .2s;
    }

    .modal-container.active .modal {
        transform: translateY(0);
    }

    .modal h2 {
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 16px;
    }

    .form-group label {
        display: block;

        margin-bottom: 7px;

        color: var(--muted);
        font-size: 13px;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;

        padding: 12px 13px;

        border: 1px solid var(--border);
        border-radius: 12px;

        background: #101012;
        color: var(--text);

        outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: rgba(255,255,255,.25);
    }

    .form-group textarea {
        min-height: 90px;
        resize: vertical;
    }

    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;

        margin-top: 20px;
    }

    .cancel-button,
    .save-button {
        padding: 11px 16px;

        border: none;
        border-radius: 11px;

        font-weight: 600;
    }

    .cancel-button {
        background: var(--surface-light);
        color: var(--text);
    }

    .save-button {
        background: white;
        color: #111;
    }

    .save-button:disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    /* MOBILE */

    @media (max-width: 650px) {

        main {
            padding: 25px 15px 50px;
        }

        .heading {
            align-items: flex-start;
            flex-direction: column;
        }

        .heading h1 {
            font-size: 28px;
        }

        .add-button {
            width: 100%;
        }

        .grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .card-content {
            padding: 12px;
        }

        .card-title {
            font-size: 15px;
        }

        .card-description {
            font-size: 13px;
        }
    }
</style>
</head>

<body>

<!-- TOPBAR -->

<header class="topbar">

    <button
        class="menu-button"
        onclick="abrirMenu()"
        aria-label="Abrir menú">
        ☰
    </button>

    <div class="topbar-title">
        Recuerdos
    </div>

</header>


<!-- SIDEBAR -->

<div
    id="overlay"
    class="overlay"
    onclick="cerrarMenu()">
</div>

<aside
    id="sidebar"
    class="sidebar">

    <div class="sidebar-header">

        <div class="sidebar-title">
            Recuerdos
        </div>

        <button
            class="close-menu"
            onclick="cerrarMenu()"
            aria-label="Cerrar menú">
            ×
        </button>

    </div>


    <button
        class="menu-item active"
        onclick="cerrarMenu()">

        🏠
        <span>Momentos</span>

    </button>


    <button
        class="menu-item">

        ⭐
        <span>Favoritos</span>

    </button>


    <button
        class="menu-item">

        🗓️
        <span>Línea de tiempo</span>

    </button>


    <div class="sidebar-bottom">

        <div
            id="emailUsuario"
            class="user-email">
            Cargando...
        </div>

        <button
            class="menu-item logout"
            onclick="cerrarSesion()">

            ↪
            <span>Cerrar sesión</span>

        </button>

    </div>

</aside>


<!-- CONTENIDO -->

<main>

    <div class="heading">

        <div>
            <h1>Momentos</h1>
            <p>Una colección de recuerdos.</p>
        </div>

        <button
            class="add-button"
            onclick="abrirModal()">

            ＋ Agregar recuerdo

        </button>

    </div>


    <!-- ESTADO VACÍO -->

    <section
        id="emptyState"
        class="empty">

        <div class="empty-icon">
            📷
        </div>

        <h2>Todavía no hay recuerdos</h2>

        <p>
            Agregá una foto para comenzar a crear tu colección.
        </p>

    </section>


    <!-- GRID -->

    <section
        id="recuerdosGrid"
        class="grid"
        style="display:none;">
    </section>

</main>


<!-- MODAL -->

<div
    id="modalContainer"
    class="modal-container"
    onclick="cerrarModalDesdeFondo(event)">

    <div
        class="modal"
        onclick="event.stopPropagation()">

        <h2>Nuevo recuerdo</h2>


        <div class="form-group">

            <label for="foto">
                Foto
            </label>

            <input
                id="foto"
                type="file"
                accept="image/*">

        </div>


        <div class="form-group">

            <label for="titulo">
                Título
            </label>

            <input
                id="titulo"
                type="text"
                placeholder="Ej: Una tarde juntos">

        </div>


        <div class="form-group">

            <label for="descripcion">
                Descripción
            </label>

            <textarea
                id="descripcion"
                placeholder="Escribí algo sobre este recuerdo..."></textarea>

        </div>


        <div class="form-group">

            <label for="fecha">
                Fecha
            </label>

            <input
                id="fecha"
                type="date">

        </div>


        <div class="modal-actions">

            <button
                class="cancel-button"
                onclick="cerrarModal()">

                Cancelar

            </button>


            <button
                id="guardarBtn"
                class="save-button"
                onclick="guardarRecuerdo()">

                Guardar recuerdo

            </button>

        </div>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>


<script>

/* =========================
   SESIÓN
========================= */

async function comprobarSesion() {

    try {

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Error comprobando sesión:",
                error
            );

            window.location.replace("index.html");

            return;
        }


        if (!data || !data.session) {

            window.location.replace("index.html");

            return;
        }


        const usuario = data.session.user;


        const emailElemento =
            document.getElementById("emailUsuario");


        if (emailElemento) {

            emailElemento.textContent =
                usuario.email || "";

        }


        cargarRecuerdos();

    } catch (error) {

        console.error(
            "Error inesperado comprobando sesión:",
            error
        );

        window.location.replace("index.html");

    }

}


/* =========================
   CARGAR RECUERDOS
========================= */

async function cargarRecuerdos() {

    const emptyState =
        document.getElementById("emptyState");

    const grid =
        document.getElementById("recuerdosGrid");


    const {
        data,
        error
    } = await supabaseClient
        .from("memories")
        .select("*")
        .order("date", {
            ascending: false
        });


    if (error) {

        console.error(
            "Error cargando recuerdos:",
            error
        );

        return;
    }


    if (!data || data.length === 0) {

        emptyState.style.display = "flex";
        grid.style.display = "none";

        return;
    }


    emptyState.style.display = "none";
    grid.style.display = "grid";


    grid.innerHTML = "";


    data.forEach(recuerdo => {

        const card =
            document.createElement("article");

        card.className = "card";


        const content =
            document.createElement("div");

        content.className = "card-content";


        const title =
            document.createElement("div");

        title.className = "card-title";

        title.textContent =
            recuerdo.title || "Sin título";


        const description =
            document.createElement("div");

        description.className =
            "card-description";

        description.textContent =
            recuerdo.description || "";


        const date =
            document.createElement("div");

        date.className = "card-date";

        date.textContent =
            recuerdo.date || "";


        content.appendChild(title);
        content.appendChild(description);
        content.appendChild(date);

        card.appendChild(content);

        grid.appendChild(card);

    });

}


/* =========================
   MENÚ
========================= */

function abrirMenu() {

    document
        .getElementById("sidebar")
        .classList.add("active");

    document
        .getElementById("overlay")
        .classList.add("active");

}


function cerrarMenu() {

    document
        .getElementById("sidebar")
        .classList.remove("active");

    document
        .getElementById("overlay")
        .classList.remove("active");

}


/* =========================
   MODAL
========================= */

function abrirModal() {

    document
        .getElementById("modalContainer")
        .classList.add("active");

}


function cerrarModal() {

    document
        .getElementById("modalContainer")
        .classList.remove("active");

}


function cerrarModalDesdeFondo(event) {

    if (
        event.target ===
        document.getElementById("modalContainer")
    ) {

        cerrarModal();

    }

}


/* =========================
   GUARDAR RECUERDO
========================= */

async function guardarRecuerdo() {

    alert(
        "La subida de fotos la conectaremos en el próximo paso 📸"
    );

}


/* =========================
   CERRAR SESIÓN
========================= */

async function cerrarSesion() {

    const boton =
        document.querySelector(".logout");

    try {

        if (boton) {

            boton.disabled = true;

            boton.style.opacity = "0.5";

        }


        const {
            error
        } = await supabaseClient.auth.signOut();


        if (error) {

            console.error(
                "Error al cerrar sesión:",
                error
            );

        }


        /*
         * replace() evita que el navegador
         * conserve recuerdos.html en el historial.
         */

        window.location.replace("index.html");


    } catch (error) {

        console.error(
            "Error inesperado al cerrar sesión:",
            error
        );

        /*
         * Aunque ocurra un error,
         * volvemos al login.
         */

        window.location.replace("index.html");

    }

}


/* =========================
   INICIO
========================= */

document.addEventListener(
    "DOMContentLoaded",
    comprobarSesion
);

</script>

</body>
</html>
