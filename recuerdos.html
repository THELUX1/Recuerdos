<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nuestros recuerdos ❤️</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://accounts.google.com/gsi/client"></script>

<script src="js/supabase.js"></script>
<script src="js/google-drive.js"></script>
<script src="js/recuerdos.js"></script>

    <link
        rel="stylesheet"
        href="css/recuerdos.css"
    >

</head>


<body>
<button
    id="googleDriveTest"
    onclick="iniciarGoogleDrive()"
    style="
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 99999;
        padding: 14px 18px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
    "
>
    ☁️ Conectar Google Drive
</button>

<div
    id="googleDriveStatus"
    style="
        position: fixed;
        bottom: 80px;
        right: 20px;
        z-index: 99999;
        padding: 12px 16px;
        border-radius: 12px;
        background: #171717;
        color: white;
        display: none;
    "
></div>
    <!-- =====================================
         BOTÓN MENÚ
    ====================================== -->

    <button
    id="menuToggle"
    class="menu-toggle"
    onclick="alternarMenu()"
    aria-label="Abrir menú"
    aria-expanded="false"
>
    <span></span>
    <span></span>
    <span></span>
</button>

<div
    id="menuOverlay"
    class="menu-overlay"
    onclick="cerrarMenu()"
></div>


    <div class="app">


        <!-- =================================
             SIDEBAR
        ================================== -->

        <aside class="sidebar">

            <div class="logo">

                <span class="logo-icon">
                    ♡
                </span>

                <div>

                    <strong>
                        Nuestros
                    </strong>

                    <span>
                        recuerdos
                    </span>

                </div>

            </div>


            <nav class="navigation">

                <button
                    class="nav-item active"
                    data-section="momentos"
                >

                    <span>
                        ⌂
                    </span>

                    <span>
                        Momentos
                    </span>

                </button>


                <button
                    class="nav-item"
                    data-section="favoritos"
                >

                    <span>
                        ♡
                    </span>

                    <span>
                        Favoritos
                    </span>

                </button>


                <button
                    class="nav-item"
                    data-section="timeline"
                >

                    <span>
                        ◷
                    </span>

                    <span>
                        Línea de tiempo
                    </span>

                </button>

            </nav>


            <div class="sidebar-bottom">

                <div class="user-card">

                    <div class="user-avatar">
                        ♡
                    </div>

                    <div class="user-info">

                        <span>
                            Sesión iniciada
                        </span>

                        <strong id="emailUsuario">
                            Cargando...
                        </strong>

                    </div>

                </div>


                <button
                    id="logoutButton"
                    class="logout-button"
                    onclick="cerrarSesion()"
                >

                    <span>
                        ↪
                    </span>

                    <span>
                        Cerrar sesión
                    </span>

                </button>

            </div>

        </aside>



        <!-- =================================
             CONTENIDO
        ================================== -->

        <main class="main-content">


            <header class="page-header">

                <div>

                    <span class="eyebrow">
                        NUESTRA HISTORIA
                    </span>

                    <h1>
                        Momentos
                    </h1>

                    <p>
                        Un pequeño lugar para guardar
                        todo lo que no queremos olvidar.
                    </p>

                </div>


                <button
                    class="add-memory"
                    onclick="abrirModal()"
                >

                    <span>
                        +
                    </span>

                    Nuevo recuerdo

                </button>

            </header>



            <!-- GALERÍA -->

            <section
                id="gallery"
                class="gallery"
            >

                <div class="loading">
                    Cargando recuerdos...
                </div>

            </section>


        </main>

    </div>



    <!-- =====================================
         MODAL NUEVO RECUERDO
    ====================================== -->

    <div
        id="modal"
        class="modal"
        onclick="cerrarModalFondo(event)"
    >

        <div class="modal-content">


            <div class="modal-header">

                <div>

                    <span class="eyebrow">
                        NUEVO MOMENTO
                    </span>

                    <h2>
                        Guardar recuerdo
                    </h2>

                </div>


                <button
                    class="modal-close"
                    onclick="cerrarModal()"
                    type="button"
                >
                    ×
                </button>

            </div>



            <form
                id="memoryForm"
                onsubmit="guardarRecuerdo(event)"
            >


                <!-- FOTO -->

                <div class="upload-area">

                    <span class="upload-icon">
                        ↑
                    </span>

                    <strong>
                        Elegí una foto
                    </strong>

                    <span>
                        JPG, PNG, WEBP · Máximo 20 MB
                    </span>


                    <input
                        id="archivo"
                        type="file"
                        accept="image/*"
                        required
                    >

                </div>



                <!-- TÍTULO -->

                <div class="form-field">

                    <label for="titulo">
                        Título
                    </label>

                    <input
                        id="titulo"
                        type="text"
                        placeholder="¿Qué estaba pasando?"
                        maxlength="100"
                    >

                </div>



                <!-- DESCRIPCIÓN -->

                <div class="form-field">

                    <label for="descripcion">
                        Descripción
                    </label>

                    <textarea
                        id="descripcion"
                        placeholder="Guardá algún detalle de este momento..."
                        maxlength="500"
                    ></textarea>

                </div>



                <!-- FECHA -->

                <div class="form-field">

                    <label for="fecha">
                        Fecha
                    </label>

                    <input
                        id="fecha"
                        type="date"
                    >

                </div>



                <button
                    id="saveButton"
                    class="save-memory"
                    type="submit"
                >

                    Guardar recuerdo

                    <span>
                        ♡
                    </span>

                </button>


            </form>

        </div>

    </div>



    <!-- =====================================
         VISOR DE FOTOS
    ====================================== -->

    <div
        id="viewer"
        class="viewer"
        onclick="cerrarViewerFondo(event)"
    >

        <button
            class="viewer-close"
            onclick="cerrarViewer()"
            type="button"
        >
            ×
        </button>


        <img
            id="viewerImage"
            src=""
            alt="Recuerdo"
        >

    </div>



    <!-- TOAST -->

    <div
        id="toast"
        class="toast"
    ></div>

</body>

</html>
