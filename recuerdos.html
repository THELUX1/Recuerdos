<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Recuerdos</title>


<style>

:root {

    --background: #0e0e10;
    --surface: #17171a;
    --surface-light: #202024;

    --text: #f4f4f5;
    --muted: #929298;

    --border: rgba(255,255,255,.08);

}


* {

    box-sizing: border-box;

    margin: 0;
    padding: 0;

}


body {

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        var(--background);

    color:
        var(--text);

}


/* =========================
   TOPBAR
========================= */

.topbar {

    position: sticky;

    top: 0;

    z-index: 50;

    height: 64px;

    display: flex;

    align-items: center;

    padding: 0 20px;

    background:
        rgba(14,14,16,.92);

    backdrop-filter:
        blur(14px);

    border-bottom:
        1px solid var(--border);

}


.menu-button {

    width: 42px;
    height: 42px;

    border: none;

    border-radius: 12px;

    background:
        transparent;

    color:
        var(--text);

    font-size: 25px;

    cursor: pointer;

}


.menu-button:hover {

    background:
        var(--surface-light);

}


.topbar-title {

    margin-left: 12px;

    font-size: 18px;

    font-weight: 600;

}


/* =========================
   CONTENIDO
========================= */

main {

    width: 100%;

    max-width: 1100px;

    margin: auto;

    padding:
        35px 20px 60px;

}


.heading {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap: 20px;

    margin-bottom: 30px;

}


.heading h1 {

    font-size: 32px;

    margin-bottom: 7px;

}


.heading p {

    color:
        var(--muted);

    font-size: 15px;

}


.add-button {

    border: none;

    border-radius: 14px;

    padding:
        13px 18px;

    background:
        white;

    color:
        #111;

    font-weight: 600;

    cursor: pointer;

}


/* =========================
   EMPTY
========================= */

.empty {

    min-height: 330px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    border:
        1px dashed rgba(255,255,255,.12);

    border-radius: 20px;

}


.empty-icon {

    font-size: 45px;

    margin-bottom: 15px;

}


.empty h2 {

    font-size: 21px;

    margin-bottom: 8px;

}


.empty p {

    color:
        var(--muted);

    max-width: 350px;

    line-height: 1.5;

}


/* =========================
   SIDEBAR
========================= */

.overlay {

    position: fixed;

    inset: 0;

    z-index: 90;

    background:
        rgba(0,0,0,.55);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .25s;

}


.overlay.active {

    opacity: 1;

    pointer-events: auto;

}


.sidebar {

    position: fixed;

    top: 0;
    left: 0;

    z-index: 100;

    width:
        min(310px,85vw);

    height: 100vh;

    padding: 20px;

    background:
        #151518;

    border-right:
        1px solid var(--border);

    transform:
        translateX(-100%);

    transition:
        transform .25s ease;

    display: flex;

    flex-direction: column;

}


.sidebar.active {

    transform:
        translateX(0);

}


.sidebar-header {

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    margin-bottom: 25px;

}


.sidebar-title {

    font-size: 20px;

    font-weight: 600;

}


.close-menu {

    width: 40px;
    height: 40px;

    border: none;

    border-radius: 10px;

    background:
        transparent;

    color:
        var(--text);

    font-size: 22px;

    cursor: pointer;

}


.menu-item {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 13px;

    padding:
        13px 14px;

    margin-bottom: 5px;

    border: none;

    border-radius: 12px;

    background:
        transparent;

    color:
        var(--text);

    text-align: left;

    font-size: 15px;

    cursor: pointer;

}


.menu-item:hover {

    background:
        var(--surface-light);

}


.menu-item.active {

    background:
        var(--surface-light);

}


.sidebar-bottom {

    margin-top: auto;

}


.user-email {

    padding:
        12px 14px;

    color:
        var(--muted);

    font-size: 12px;

    word-break: break-word;

    border-top:
        1px solid var(--border);

}


.logout {

    color:
        #ff8b8b;

}


/* =========================
   MODAL
========================= */

.modal-container {

    position: fixed;

    inset: 0;

    z-index: 200;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.7);

    opacity: 0;

    pointer-events: none;

}


.modal-container.active {

    opacity: 1;

    pointer-events: auto;

}


.modal {

    width: 100%;

    max-width: 500px;

    padding: 25px;

    background:
        var(--surface);

    border:
        1px solid var(--border);

    border-radius: 20px;

}


.modal h2 {

    margin-bottom: 20px;

}


.form-group {

    margin-bottom: 16px;

}


.form-group label {

    display: block;

    margin-bottom: 7px;

    color:
        var(--muted);

    font-size: 13px;

}


.form-group input,
.form-group textarea {

    width: 100%;

    padding: 12px 13px;

    border:
        1px solid var(--border);

    border-radius: 12px;

    background:
        #101012;

    color:
        var(--text);

    outline: none;

}


.form-group textarea {

    min-height: 90px;

    resize: vertical;

}


.modal-actions {

    display: flex;

    justify-content:
        flex-end;

    gap: 10px;

    margin-top: 20px;

}


.cancel-button,
.save-button {

    padding:
        11px 16px;

    border: none;

    border-radius: 11px;

    font-weight: 600;

    cursor: pointer;

}


.cancel-button {

    background:
        var(--surface-light);

    color:
        var(--text);

}


.save-button {

    background:
        white;

    color:
        #111;

}


/* =========================
   MOBILE
========================= */

@media (max-width:650px) {

    main {

        padding:
            25px 15px 50px;

    }


    .heading {

        align-items:
            flex-start;

        flex-direction:
            column;

    }


    .heading h1 {

        font-size: 28px;

    }


    .add-button {

        width: 100%;

    }

}

</style>

</head>


<body>


<header class="topbar">

    <button
        class="menu-button"
        onclick="abrirMenu()">

        ☰

    </button>


    <div class="topbar-title">

        Recuerdos

    </div>

</header>



<div
    id="overlay"
    class="overlay"
    onclick="cerrarMenu()">
</div>



<aside
    id="sidebar"
    class="sidebar">


    <div class="sidebar-header">

        <div class="sidebar-title">

            Recuerdos

        </div>


        <button
            class="close-menu"
            onclick="cerrarMenu()">

            ×

        </button>

    </div>



    <button
        class="menu-item active"
        onclick="cerrarMenu()">

        🏠
        <span>Momentos</span>

    </button>


    <button
        class="menu-item">

        ⭐
        <span>Favoritos</span>

    </button>


    <button
        class="menu-item">

        🗓️
        <span>Línea de tiempo</span>

    </button>



    <div class="sidebar-bottom">


        <div
            id="emailUsuario"
            class="user-email">

            Cargando...

        </div>


        <button
            id="logoutButton"
            class="menu-item logout"
            onclick="cerrarSesion()">

            ↪
            <span>Cerrar sesión</span>

        </button>

    </div>

</aside>



<main>


    <div class="heading">


        <div>

            <h1>
                Momentos
            </h1>


            <p>
                Una colección de recuerdos.
            </p>

        </div>


        <button
            class="add-button"
            onclick="abrirModal()">

            ＋ Agregar recuerdo

        </button>

    </div>



    <section
        id="emptyState"
        class="empty">


        <div class="empty-icon">

            📷

        </div>


        <h2>

            Todavía no hay recuerdos

        </h2>


        <p>

            Agregá una foto para comenzar
            a crear tu colección.

        </p>


    </section>


</main>



<div
    id="modalContainer"
    class="modal-container">


    <div class="modal">


        <h2>
            Nuevo recuerdo
        </h2>


        <div class="form-group">

            <label>
                Foto
            </label>

            <input
                type="file"
                id="foto"
                accept="image/*">

        </div>


        <div class="form-group">

            <label>
                Título
            </label>

            <input
                type="text"
                id="titulo"
                placeholder="Ej: Una tarde juntos">

        </div>


        <div class="form-group">

            <label>
                Descripción
            </label>

            <textarea
                id="descripcion"
                placeholder="Escribí algo sobre este recuerdo...">
            </textarea>

        </div>


        <div class="form-group">

            <label>
                Fecha
            </label>

            <input
                type="date"
                id="fecha">

        </div>


        <div class="modal-actions">


            <button
                class="cancel-button"
                onclick="cerrarModal()">

                Cancelar

            </button>


            <button
                class="save-button"
                onclick="guardarRecuerdo()">

                Guardar recuerdo

            </button>


        </div>

    </div>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>



<script>

/* =========================
   COMPROBAR SESIÓN
========================= */

async function comprobarSesion() {

    console.log(
        "Comprobando sesión..."
    );


    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Error obteniendo sesión:",
                error
            );

            return;

        }


        /*
         * Si no existe sesión,
         * volvemos al login.
         */

        if (
            !data ||
            !data.session
        ) {

            console.log(
                "No hay sesión. Volviendo al login."
            );

            window.location.replace(
                "./index.html"
            );

            return;

        }


        /*
         * Hay sesión.
         */

        console.log(
            "Sesión encontrada:",
            data.session.user.email
        );


        document
            .getElementById("emailUsuario")
            .textContent =
            data.session.user.email || "";


    }

    catch (error) {

        console.error(
            "Error inesperado:",
            error
        );

    }

}


/* =========================
   CERRAR SESIÓN
========================= */

async function cerrarSesion() {

    const boton =
        document.getElementById(
            "logoutButton"
        );


    if (boton) {

        boton.disabled = true;

        boton.innerHTML =
            "↪ <span>Cerrando sesión...</span>";

    }


    console.log(
        "Cerrando sesión..."
    );


    try {

        const {
            error
        } =
        await supabaseClient.auth.signOut();


        if (error) {

            console.error(
                "Error cerrando sesión:",
                error
            );

        }


        console.log(
            "Sesión cerrada."
        );


        /*
         * IMPORTANTE:
         *
         * replace() elimina recuerdos.html
         * del historial inmediato.
         */

        window.location.replace(
            "./index.html"
        );


    }

    catch (error) {

        console.error(
            "Error inesperado al cerrar sesión:",
            error
        );


        /*
         * Aunque exista un error,
         * volvemos al login.
         */

        window.location.replace(
            "./index.html"
        );

    }

}


/* =========================
   MENÚ
========================= */

function abrirMenu() {

    document
        .getElementById("sidebar")
        .classList.add("active");


    document
        .getElementById("overlay")
        .classList.add("active");

}


function cerrarMenu() {

    document
        .getElementById("sidebar")
        .classList.remove("active");


    document
        .getElementById("overlay")
        .classList.remove("active");

}


/* =========================
   MODAL
========================= */

function abrirModal() {

    document
        .getElementById("modalContainer")
        .classList.add("active");

}


function cerrarModal() {

    document
        .getElementById("modalContainer")
        .classList.remove("active");

}


/* =========================
   GUARDAR
========================= */

function guardarRecuerdo() {

    alert(
        "La subida de fotos la conectaremos en el próximo paso 📸"
    );

}


/* =========================
   INICIO
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        comprobarSesion();

    }
);

</script>


</body>
</html>
